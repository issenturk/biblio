name: Windows build

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["windows/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Smoke test (reference parser, offline)
        run: dotnet run --project windows/Biblio.Cli -c Release -- --parse "Becker, G. S. (1965). A Theory of the Allocation of Time. The economic journal, 75(299), 493-517"
      - name: Publish single-file exe
        run: >
          dotnet publish windows/Biblio.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o out
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out/Biblio.exe -DestinationPath Biblio-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Biblio-windows-x64
          path: Biblio-windows-x64.zip
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Biblio-windows-x64.zip
